<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Synthetic device status</title>
  </head>
  <body>
    <main>
      <h1 id="device-status">Device status</h1>
      <table>
        <thead>
          <tr>
            <th scope="col">Signal</th>
            <th scope="col">Value</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>Ready</td>
            <td>True</td>
          </tr>
        </tbody>
      </table>
      <pre><code class="language-json">{"ready":true}</code></pre>
    </main>
  </body>
</html>
