# File: Analyze authored sources, not duplicate generated vendor bundles.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '31 11 * * 3'

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3; coordinated version
        with:
          languages: javascript-typescript
          queries: security-and-quality
          config-file: ./.github/codeql.yml
          trap-caching: false
          dependency-caching: false
      - name: Analyze
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3; coordinated version
        with:
          upload-database: false
          wait-for-processing: true

  supporting:
    name: Analyze ${{ matrix.language }} native tooling
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        language: [python, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
          trap-caching: false
          dependency-caching: false
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
          upload-database: false
          wait-for-processing: true
