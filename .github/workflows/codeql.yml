# File: Analyze authored sources, not duplicate generated vendor bundles.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '31 11 * * 3'

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.38.3; coordinated version
        with:
          languages: javascript-typescript
          queries: security-and-quality
          config-file: ./.github/codeql.yml
          trap-caching: false
          dependency-caching: false
      - name: Analyze
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3; coordinated version
        with:
          upload-database: false
