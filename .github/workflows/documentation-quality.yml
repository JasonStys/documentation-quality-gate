name: Documentation quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Run local documentation quality action
        id: documentation-quality
        uses: ./
        with:
          config: .docquality.json
          output-directory: artifacts/documentation-quality
      - name: Upload SARIF to code scanning
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: artifacts/documentation-quality/documentation-quality.sarif
          category: documentation-quality
      - name: Upload documentation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: documentation-quality-report
          path: artifacts/documentation-quality/
          if-no-files-found: error
          retention-days: 14
